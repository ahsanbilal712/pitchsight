  - shot: footage/shot_lfc_haaland_v5
    from: 0.4
    to: 3.0
    captions:
      - {from: 0.1, to: 2.5, text: "Haaland's penalty: 0.76."}

  - shot: footage/lfc_watching_v5       # WHYLINE is watching: Liverpool's threat zone live, 86:19-86:22 (no number)
    from: 4.5
    to: 7.5
    captions:
      - {from: 0.1, to: 2.9, text: "WHYLINE is watching: where Liverpool's next shot will come from."}

  - shot: footage/lfc_v5_v5             # continuous: the strike at 86:25
    from: 0.0
    to: 9.1
    captions:
      - {from: 0.2, to: 3.6, text: "86th minute, all square. Szoboszlai shoots from 29 m."}
      - {from: 3.8, to: 7.8, text: "0.02 xG: the keeper, the cone, the bodies in the way. Blocked."}

  - shot: footage/lfc_v5_v5
    from: 9.8
    to: 12.8

  - shot: footage/mci_amad_v5_v5        # Man Utd v Man City 56:41
    from: 1.2
    to: 9.1
    captions:
      - {from: 0.2, to: 3.6, text: "Man Utd v Man City. Amad shoots from here: 0.06 xG."}
      - {from: 3.8, to: 7.8, text: "The pass into the box was worth 0.11, almost twice as much."}

  - shot: v5/studio_mci                # the newsroom putting Amad's line on air (track B's v5 run, 528ac3f)
    from: 6.0
    to: 12.0
    crop: [258, 60, 1110, 624]       # the agent trace and the cue on air (16:9), nothing else
    captions:
      - {from: 0.2, to: 5.8, text: "Behind it, the newsroom: each agent step traced, the line checked before it airs."}

  - shot: footage/mci_ghost_v5          # the other timeline after the pass to #19: the most typical of 2,000
    from: 0.0
    to: 6.8
    captions:
      - {from: 0.3, to: 6.6, text: "It replays the pass 2,000 times. This is the most typical future, on the real pitch."}

  - shot: footage/mci_amad_v5_v5
    from: 9.8
    to: 12.3

  - shot: footage/shot_mci_save_v5
    from: 0.4
    to: 2.9
    captions:
      - {from: 0.1, to: 2.4, text: "Seconds later, 0.32 xG: saved."}

  - shot: footage/shot_tot_werner_v5    # Man Utd v Spurs 38:03 (track A 115f6a0, directions corrected)
    from: 0.4
    to: 2.9
    captions:
      - {from: 0.1, to: 2.5, text: "Werner, from 16 m: 0.08 xG. Saved."}

  - shot: footage/ars_v5_v5             # Arsenal v Chelsea 79:11
    from: 1.2
    to: 9.1
    captions:
      - {from: 0.2, to: 7.8, text: "Arsenal v Chelsea. Eze from 16 m: 0.08 xG. Saved."}

  - shot: footage/mci_mbeumo_v5_v5      # finishes that went in
    from: 1.2
    to: 7.9
    captions:
      - {from: 0.2, to: 6.5, text: "Mbeumo from here: 0.10 xG."}

  - shot: footage/mci_mbeumo_v5_v5
    from: 9.8
    to: 14.8

  - shot: footage/mci_dorgu_v5_v5
    from: 1.2
    to: 7.9
    captions:
      - {from: 0.2, to: 6.5, text: "Dorgu, from 4.5 m: 0.48 xG."}

  - shot: footage/mci_dorgu_v5_v5
    from: 9.8
    to: 14.8

  - shot: footage/lfc_xg_race_v5        # the close: how the last 20 minutes added up
    from: 0.0
    to: 9.0
    captions:
      - {from: 0.3, to: 8.7, text: "Liverpool v Man City, the last 20 minutes in xG: City 1.21, Liverpool 0.20."}

  - card: end
    duration: 3.5
    title: "WHYLINE"
    lines: ["Every line on screen has a why.", "Premier League clips used with permission"]

