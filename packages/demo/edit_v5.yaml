# Video v5 edit decision list, DRAFT 2 (owner, 23 Oct: real-data xG; no goal-in-10s, no win chance, no speed gun;
# better pass lines and shot visuals). Assembled by
#   python packages/demo/assemble.py packages/demo/edit_v5.yaml
# Every number is xG from track A's real-data reference model (cache/v5, 82b6e74 and ca8eef7: Soccermatics'
# logistic fit on 8,451 PL shots; a pass = P(complete) x xG at the receiver's spot). Real footage and names only.
# Freezes: demo.composite --style v5 (slow-motion ramp, punch-in, rewind, goal flash); the montage: demo.live
# ShotXG; the close: XGRace. v3 final (edit_v3.yaml) is the fallback.
# The Spurs pass X-ray is cut: track A found the attack direction reversed there (115f6a0).
# Lead's rules: a pass is called better only if it beats the shot by >= 0.04 xG with the receiver > 0.5 m onside
# (Amad only); every shot shows its strike-frame xG (shots_0) except Amad's decision freeze ("from here").
# Draft 2 (lead): the system is back on screen: the threat zone live (no number), the ghost future after Amad's
# better pass (track A's medoid of 2,000 pass-to-#19 futures). The studio beat waits for track B's Amad run.

out: packages/demo/out/final_v5.mp4
size: [1920, 1080]
fps: 30
caption_band: 120

clips:
  - shot: footage/shot_lfc_fk_v5        # hook: a goal from 0.02 xG
    from: 0.0
    to: 3.7
    captions:
      - {from: 0.1, to: 3.6, text: "Liverpool v Man City. Szoboszlai's free kick: 0.02 xG. In."}

  - shot: footage/shot_lfc_silva_v5
    from: 0.4
    to: 3.1
    captions:
