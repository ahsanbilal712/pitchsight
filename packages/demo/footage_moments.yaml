    t_s: 1190.88
    pre_s: 2.0
    post_s: 3.0
    moment_file: manutd-mancity-2526/moments/1189840.json
    attacks: "-x"
    team_name: "Man Utd"
    kits: {home: [218, 41, 28], away: [120, 182, 232]}
    actor: {player: "Dorgu", label: "Dorgu"}
    target: null
    xg: data/footage/manutd-mancity-2526/cache/v5/xg_decision_1189840.json
    line_v5: data/footage/manutd-mancity-2526/cache/v5/lines_1189840.json   # track B's reviewed v5 lower-third
