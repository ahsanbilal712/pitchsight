    kind: shot_xg
    data: data/footage/manutd-mancity-2526/cache/v5/shots_0.json
    clip_ms: 880080
    team: away
    pre_s: 1.2
    outcome_after_s: 0.5
    post_s: 1.2
    kits: {home: [218, 41, 28], away: [120, 182, 232]}

  lfc_xg_race_v5:                    # the close: cumulative xG over Liverpool v Man City's last 20 minutes (track A)
