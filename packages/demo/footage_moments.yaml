# Featured real-clip moments for the compositor (T-108). Clips are the four downloaded data/footage/*/clip.mp4
# (sources and permission: data/footage/SOURCES.md); nothing here is media. Composites go to packages/demo/out/footage/.
#
#   python -m demo.composite <moment> [--png] [--clip] [--standin]
#
# camera: hand landmarks on the freeze frame (pitch metres <-> pixels, >= 4) and the markings the fit refines
#   against; `top` is the advertising boards' lower edge as a polyline of pixels (nothing above it is pitch).
#   Track A's per-frame calibration (T-104: calib/<shot>.json for the usable shot holding t_s) is measured the
#   same way and used when its drift is no worse.
# actor/target: `player` is a label in the moment file (players and ball in pitch metres); `label` is the tag drawn
#   (real names on the featured clips: the written permission names club and player names, lead 23 Oct).
# Pitch metres: x 0..105 towards the goal the attacking side faces, y 0..68 with y = 0 the touchline nearest
# the main camera. Pixels are 1920x1080 frames.
# counterfactual: the precomputed rollout for the moment (T-109, track B: first 100 futures the actual action, the
# last 100 the alternative; `futures: alternative` when every path is the alternative). line: the reviewed
# lower-third. options: the two bars of the win-chance card. panels: right puts lower-third and card bottom right. Without a counterfactual, --standin draws the golden
# match's cf_000070 futures re-anchored on the players, watermarked, for checking the look only; a
# stand-in never goes in the video.

moments:
  lfc_sliding_doors:
    clip: liverpool-mancity-2526
    t_s: 875.0                       # broadcast clock 86:23; e_0033 (clip_ms 875000): the shot is blocked
    shot: [802.6, 891.0]             # the steady wide shot it sits in (shots.json)
    camera:
      landmarks:
        pitch: [[105, 68], [105, 54.16], [88.5, 54.16], [88.5, 13.84], [99.5, 43.16], [99.5, 24.84]]
        pixel: [[920, 205], [1150, 268], [578, 313], [1540, 705], [1195, 345], [1688, 495]]
      lines: [penalty_box_right, goal_box_right, goal_line_right, touchline_far, penalty_arc_right]
      top: [[0, 249], [915, 208], [916, 200], [1919, 200]]
    moment_file: liverpool-mancity-2526/moments/875000.json    # T-107 hand-marked frame (track A, a152373)
    actor: {player: "#8", feet: [728, 705], label: "Szoboszlai"}    # feet: fallback without the moment file
    ball: [832, 682]
    target: {player: "#11", feet: [1700, 797], label: "Salah · free"}
    counterfactual: data/footage/liverpool-mancity-2526/cache/counterfactuals/cf_000001.json   # T-109 (a751c1a)
    line: data/footage/liverpool-mancity-2526/cache/lines/mo_00001.json    # reviewed lower-third
    options: {actual: "Shot", alternative: "Pass to Salah"}
    kits: {home: [214, 32, 52], away: [120, 182, 232]}         # analyst heatmap: Liverpool red, City sky blue
    player_cam:                                                # --mode player_cam
      name: Dominik Szoboszlai
      club: "#8 · Liverpool"
      side: home
      facts: [{id: f_000001, caption: "Distance to goal"}]

  # The other three featured moments (config/footage.yaml, T-109): no hand landmarks; the camera is seeded with the
  # moment file's homography and refined against the paint (far touchline and boards left out).
  ars_sliding_doors:
    clip: arsenal-chelsea-2526
    t_s: 1300.5                      # broadcast clock 79:10; Eze's shot is saved
    moment_file: arsenal-chelsea-2526/moments/1300500.json
    actor: {player: "#10", label: "Eze"}
    target: {player: "#7", label: "Saka · free"}
    counterfactual: data/footage/arsenal-chelsea-2526/cache/counterfactuals/cf_000001.json
    line: data/footage/arsenal-chelsea-2526/cache/lines/mo_00001.json
    options: {actual: "Shot", alternative: "Back to Saka"}

  mun_mci_right_call:
    clip: manutd-mancity-2526
    t_s: 877.0                       # broadcast clock 56:41; Amad's shot is saved
    moment_file: manutd-mancity-2526/moments/877000.json
    actor: {player: "#16", label: "Amad"}
    target: {player: "#19", label: "#19 · unmarked"}           # no name in the moment file
    counterfactual: data/footage/manutd-mancity-2526/cache/counterfactuals/cf_000001.json
    line: data/footage/manutd-mancity-2526/cache/lines/mo_00001.json
    options: {actual: "Shot", alternative: "Pass into the box"}

  mun_tot_right_call:
    clip: manutd-spurs-2425
    t_s: 682.8                       # broadcast clock 38:02; Werner's shot is saved
    moment_file: manutd-spurs-2425/moments/682800.json
    actor: {player: "#16", label: "Werner"}
    target: null                     # the alternative is a carry round the keeper: drawn from its futures
    counterfactual: data/footage/manutd-spurs-2425/cache/counterfactuals/cf_000001.json
    line: data/footage/manutd-spurs-2425/cache/lines/mo_00001.json
    options: {actual: "Shot", alternative: "Round the keeper"}
    panels: right                    # the goal and the carry are on the left of the frame

  # Fourth Official on a real clip (track B, 3a4fb65): Bruno Fernandes on James Maddison, 40:57. The close-up cut is
  # at 777 s, so the clip resumes for 2.5 s only.
  mun_tot_fourth_official:
    clip: manutd-spurs-2425
    t_s: 772.4
    kind: fourth_official
    moment_file: manutd-spurs-2425/moments/772400.json
    actor: {player: "#8", label: "Fernandes"}
    target: {player: "#10", label: "Maddison"}
    cue: data/footage/manutd-spurs-2425/cache/fourth_official/c_907724.json
    ruling: data/footage/manutd-spurs-2425/cache/fourth_official/ruling_772400.json
    post_s: 2.5
    zoom: {factor: 2.2, at: [69.84, 53.47]}   # punch in on the contact point while frozen (far side of the pitch)
    camera: {refine: false}          # only an arc of the centre circle in view: refining on it degenerates (k1
                                     # -0.046); the moment file's homography (track A, calib/90) is used as it is

  # Overlays on the playing clip (demo.live: kind oracle | speed_gun | pass_xray | offside; `data` is the beat's
  # JSON). The Oracle (track B, 0a03108): Liverpool's chance of a shot in the next 10 s over 86:15-86:23,
  # ending on the Sliding Doors freeze (875 s). Each frame through calib/62_refined.json.
  lfc_oracle:
    clip: liverpool-mancity-2526
    kind: oracle
    t_s: 867.0
    pre_s: 1.0
    data: data/footage/liverpool-mancity-2526/cache/oracle/window_867000.json
    team: home
    kits: {home: [214, 32, 52], away: [120, 182, 232]}
    label: "Liverpool: shot in the next 10 s"

  # Video v3 beats from track A's insight files (580bad4) and track B's river (665fa36). `adapter` turns track A's
  # per-frame files into the beat's data (demo.v3_data) before drawing.
  lfc_xray:
    clip: liverpool-mancity-2526
    kind: pass_xray
    adapter: xray
    shot_id: 62
    t0: 867.0
    t1: 874.5
    names_from: 875000               # moment file whose players carry track ids (Szoboszlai, Salah)
    team: home
    kits: {home: [214, 32, 52], away: [120, 182, 232]}
    label: "Pass X-ray: goal chance if passed to"
    unnamed: "Liverpool teammate"
    tags: 4
    foot: "P(pass completes) × xG from his spot, from tracked positions"

  lfc_line:                          # lead review: a decisive margin, not one inside the error
    clip: liverpool-mancity-2526
    kind: offside
    adapter: line
    shot_id: 62
    t0: 819.0
    pass_t: 822.12                   # City pass into Liverpool's half (line_62.json): all 10 outfielders in view
    hold_s: 3.0
    attacker: "Most advanced City attacker"
    label: "Liverpool's last line at the pass"
    foot: "from broadcast tracking; error = mean of 20 checked points"

  lfc_river:
    clip: liverpool-mancity-2526
    kind: river
    data: data/footage/liverpool-mancity-2526/cache/v3/win_prob_river_11000.json
    clip_ms: 11000
    pre_s: 0.5
    hold_s: 7.0
    draw_s: 5.0
    kits: {home: [214, 32, 52], away: [120, 182, 232]}
    label: "Liverpool v Man City: the final 20 minutes"
    foot: "win probability from score and clock (WinProbHead)"

  lfc_metrics:
    clip: liverpool-mancity-2526
    kind: metrics
    data: data/footage/insights/metrics.json
    metrics_clip: liverpool-mancity-2526
    clip_ms: 820000
    pre_s: 0.5
    hold_s: 6.0
    label: "Measured on this footage"
    foot: "track A, data/footage/insights/metrics.json"

  lfc_river_strip:                   # lead review: the river as one line in the lower third of a playing clip
    clip: liverpool-mancity-2526
    kind: river_strip
    data: data/footage/liverpool-mancity-2526/cache/v3/win_prob_river_11000.json
    t0: 1.0                          # wide shot 0 (0-33 s) playing under the strip
    duration_s: 9.0
    draw_s: 6.5
    kits: {home: [214, 32, 52], away: [120, 182, 232]}
    label: "Liverpool v Man City: who wins it, the last 20 minutes"
    foot: "win chance gap, from score and clock"

  ars_keeper_cone:                   # track B (cache/v3): Raya's save at 92:15, shot from 4.5 m
    clip: arsenal-chelsea-2526
    kind: keeper_cone
    data: data/footage/arsenal-chelsea-2526/cache/v3/keeper_cone_1382650.json
    pre_s: 2.5
    hold_s: 6.5
    team: home
    kits: {home: [219, 0, 7], away: [3, 70, 148]}
    label: "Raya: where to stand"

  # v3: Man Utd v Spurs, the attack that breaks down and Van de Ven's run (track A, 0c5d026 / track B)
  tot_xray:
    clip: manutd-spurs-2425
    kind: pass_xray
    data: data/footage/manutd-spurs-2425/cache/v3/pass_xray_237767.json
    t0: 240.9
    t1: 242.0                        # Man Utd's possession; the ball is lost at 242.4 s
    team_index: 0
    team_short: "Man Utd"
    pre_s: 2.0
    hold_s: 2.0
    rows: 2
    tags: 3
    kits: {home: [218, 41, 28], away: [235, 238, 245]}
    label: "Pass X-ray: Man Utd goal chance"
    foot: "P(pass completes) × xG from his spot; from tracked positions"

  tot_speed_gun:
    clip: manutd-spurs-2425
    kind: speed_gun
    data: data/footage/manutd-spurs-2425/cache/v3/speed_gun_242700.json
    pre_s: 0.3
    hold_s: 3.0
    team: away
    kits: {home: [218, 41, 28], away: [255, 122, 26]}    # orange trail: Spurs' white does not read on grass
    tag_name: "Van de Ven"
    label: "Van de Ven: the run"
    foot: "broadcast tracking, about 0.5 m per position; the close-up is crossed in a straight line"

  mci_ghost_defender:                # Dorgu's goal, 75:28: the freeze 1 s before the shot
    clip: manutd-mancity-2526
    kind: ghost_defender
    data: data/footage/manutd-mancity-2526/cache/v3/ghost_defender_1188840.json
    pre_s: 2.0
    hold_s: 6.0
    team: away
    defender_label: "City defender"
    kits: {home: [218, 41, 28], away: [120, 182, 232]}
    label: "If City's defender had been in the cone"
