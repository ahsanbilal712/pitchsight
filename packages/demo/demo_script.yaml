# Demo script: actions the api applies on the replay clock (packages/api/demo_runner.py),
# so every take of the golden match is the same. Four entries at the clocks of the golden
# match's storyboard beats: at_clock is what runs; `ref` names the golden_moments.yaml entry it was taken
# from, and tests/demo/test_demo_script.py checks the two agree. The veto stays 15 s after half-time, where the recap waits for approval.
- {at_clock: "41:37", ref: "@kill", action: kill, target: newsroom}
- {at_clock: "45:00+15s", action: veto, cue_kind: recap}
- {at_clock: "76:52", ref: "@sliding_doors-4s", action: speed, value: 1}
- {at_clock: "77:10", ref: "@sliding_doors+14s", action: speed, value: 10}
