# Local stack: `make demo` = docker compose up (the api serves the golden replay).
# Six services: api :8000, mcp :8080, newsroom (supervisor + worker), overlay :5173, studio :5174, fan :5175.
# Replay mode needs no keys; .env (optional, git-ignored) is passed through for live mode.
x-python: &python
  build: {context: ., dockerfile: docker/python.Dockerfile}
  image: whyline-python
  volumes: [./data:/app/data, ./.checkpoints:/app/.checkpoints]
  env_file: [{path: .env, required: false}]
  environment: &env
    WHYLINE_MODE: ${WHYLINE_MODE:-replay}
    WHYLINE_MATCH_SEED: ${WHYLINE_MATCH_SEED:-4242}
    WHYLINE_REPLAY_SPEED: ${WHYLINE_REPLAY_SPEED:-1}
    WHYLINE_BLACKBOARD: /app/data/runtime/blackboard.sqlite
    WHYLINE_CHECKPOINT_DIR: /app/.checkpoints
    WHYLINE_WORKER_PIDFILE: /app/data/runtime/newsroom.pid

x-app: &app
  image: node:22.23.3-slim
  depends_on: [api]

services:
  mcp:
    <<: *python
    command: python -m mcp_server
    environment: {<<: *env, WHYLINE_MCP_HOST: 0.0.0.0, WHYLINE_MCP_PORT: "8080"}
    ports: ["8080:8080"]

  newsroom:
    <<: *python
    command: python -m newsroom.supervisor --mode ${WHYLINE_MODE:-replay} --match m_${WHYLINE_MATCH_SEED:-4242}
    environment: {<<: *env, WHYLINE_MCP_URL: "http://mcp:8080/mcp"}
    depends_on: [mcp]

  api:
    <<: *python
    command: python -m api.replay --seed ${WHYLINE_MATCH_SEED:-4242} --host 0.0.0.0 --port 8000 --feed
    ports: ["8000:8000"]
    depends_on: [newsroom]

  overlay:
    <<: *app
    working_dir: /repo/apps/overlay
    volumes: [./:/repo, /repo/apps/overlay/node_modules]   # own node_modules: the host's are macOS builds
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]

  studio:
    <<: *app
    working_dir: /repo/apps/studio
    volumes: [./:/repo, /repo/apps/studio/node_modules]   # own node_modules: the host's are macOS builds
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5174:5174"]

  fan:
    <<: *app
    working_dir: /repo/apps/fan
    volumes: [./:/repo, /repo/apps/fan/node_modules]   # own node_modules: the host's are macOS builds
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5175:5175"]
