# WHYLINE CI: nine jobs.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # CPU torch wheels on ubuntu-latest; tests that need MPS skip when it is absent.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.17.1"
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --index-url "$TORCH_INDEX" "torch==2.14.1"
      - run: pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: build the overlay for the Playwright smoke tests
        run: npm --prefix apps/overlay ci && npm --prefix apps/overlay run build
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m "not live"

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "jsonschema==4.26.0"
      - run: python scripts/validate_schemas.py

  golden-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: generate seed 4242 twice and compare hashes
        run: |
          pip install -r requirements.lock --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple
          pytest tests/kickoff/test_determinism.py -q
      - name: committed golden hashes (informational; SHA256SUMS were written on Apple silicon)
        continue-on-error: true
        run: cd data/matches/4242 && sha256sum -c SHA256SUMS

  evals-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: evaluation thresholds on committed artefacts (gate.py is standard library only)
        run: PYTHONPATH=packages python -m evals.gate packages/evals/results.json

  licence-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-licenses against the allow-list
        run: |
          pip install -r requirements.lock --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple
          python scripts/licence_scan.py

  spend-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "pyyaml==6.0.3"
      - run: python scripts/check_spend.py

  frozen-cache-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: frozen cache unchanged unless docs/video/VERSION is bumped
        run: python scripts/frozen_cache_guard.py --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}"

  chaos-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: kill and resume the newsroom, zero cues lost
        run: |
          pip install -r requirements.lock --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple
          pytest tests/chaos/test_resume.py -q
