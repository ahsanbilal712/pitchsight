# WHYLINE model routing. Role -> model. Read by packages/newsroom at start-up.
# Decision 21 Oct 2026 (owner): runtime reasoning runs on Gemini, not Claude (ADR-004 revised).
# Both models verified callable on Vertex AI project ffc-19484 on 21 Oct 2026.
# Prices (USD per 1M tokens; ADR-004 / audit rows 30-31; confirm on the Vertex AI pricing page):
#   gemini-4-argon   in 2.00  out 10.00 until 30 Nov 2026, then 4.00 / 20.00; no free tier
#   gemini-3.8-flash in 0.75  out 3.75 paid tier until 31 Dec 2026; free tier exists (limits unpublished)
#   Vertex AI batch prediction is billed at 0.5x (batch_discount in budgets.yaml).
# Rules: thinking tokens are billed as output, so count thoughts_token_count in tokens_out; effort maps to
# Gemini thinking_level (low | high; "medium" -> high on Argon, low on Flash); structured output via
# response_mime_type application/json + response_json_schema; tools via function declarations with
# automatic function calling off (the workflow runs tool rounds itself). Claude roles were removed; the
# anthropic provider block is kept so a role can be switched back by editing provider/model only.

schema_version: "1.0.0"
provider_defaults:
  anthropic:
    thinking: { type: adaptive }
    fallbacks: default
    betas: ["server-side-fallback-2026-07-01"]
    cache_control: ephemeral          # on the frozen system prompt + league context block
    max_retries: 2
    timeout_s: 60
  gemini:
    route: vertex                     # GOOGLE_GENAI_USE_VERTEXAI=true + GOOGLE_CLOUD_PROJECT; developer API if GOOGLE_API_KEY
    max_retries: 2
    timeout_s: 60

roles:
  tactician_golden:                   # precompute only, golden match, Vertex AI batch prediction
    provider: gemini
    model: gemini-4-argon
    effort: high
    max_tokens: 4000
    output_format: schemas/explanation.schema.json
    tools: []                         # batch jobs cannot run tool rounds: precompute.py pre-resolves
    pre_resolved_tools: [query_events, get_pitch_control, simulate_counterfactual, player_stats, similar_moments]
    max_tool_rounds: 0
    fallback_role: tactician_live
    batch: true

  tactician_live:
    provider: gemini
    model: gemini-4-argon
    effort: medium
    max_tokens: 3000
    output_format: schemas/explanation.schema.json
    tools: [query_events, get_pitch_control, simulate_counterfactual, player_stats]
    max_tool_rounds: 2
    timeout_s: 12
    fallback_role: tactician_degraded

  tactician_degraded:                 # no LLM; template explanation from the counterfactual numbers
    provider: none
    model: template

  proposer:
    provider: gemini
    model: gemini-3.8-flash
    effort: low
    max_tokens: 600
    output_format: inline_json        # {"alternatives": [{"kind","actor","target","reason"}]}
    timeout_s: 6
    fallback_role: proposer_rule       # enumerate passes to the 3 teammates with highest xT gain

  narrator_fast:
    provider: gemini
    model: gemini-3.8-flash
    effort: low
    max_tokens: 300
    output_format: inline_json        # {"headline","body","claims":[...]}
    timeout_s: 4
    fallback_role: narrator_template

  narrator_template:
    provider: none
    model: template

  panel_pundit:                       # three instances with distinct system prompts
    provider: gemini
    model: gemini-4-argon
    effort: medium
    max_tokens: 500
    output_format: inline_json        # {"take","claims":[...],"stance"}
    tools: [simulate_counterfactual, get_pitch_control]
    max_tool_rounds: 1
    timeout_s: 10

  panel_chair:
    provider: gemini
    model: gemini-3.8-flash
    effort: low
    max_tokens: 300
    output_format: inline_json        # {"consensus","dissent","headline"}
    timeout_s: 6

  recap:
    provider: gemini
    model: gemini-4-argon
    effort: high
    max_tokens: 6000
    output_format: inline_json        # recap_card list
    timeout_s: 90
    batch: true
    fallback_role: recap_live

  recap_live:
    provider: gemini
    model: gemini-4-argon
    effort: medium
    max_tokens: 4000
    timeout_s: 45

  judge:                              # CI evaluator only, never on the live path
    provider: gemini
    model: gemini-4-argon
    effort: medium
    max_tokens: 800

  video_tagger:                       # optional Pitchwatch adapter
    provider: gemini
    model: gemini-3.8-flash
    video_processing: agentic
    output_format: schemas/event.schema.json

  cluster_namer:                      # names the moment-embedding clusters once, offline
    provider: gemini
    model: gemini-3.8-flash
    effort: low
    max_tokens: 400
